[package]
name = "per_track"
edition = "2024"
license = "Apache 2.0"
authors = ["Miso Labs, Inc. (build@miso.network)"]

# A per-track parallel array. Construction reads `Release` to size/validate the
# array against the tracklist, so alignment is an invariant of the type rather
# than a rule each extension must remember — hence the dependency on musicos core.
[dependencies]
musicos = { git = "https://github.com/misofm/musicos.git", rev = "b3d5d4005fe36044d90e318f864dbc8b01de41da" }
