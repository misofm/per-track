[package]
name = "per_track"
edition = "2024"
license = "Apache 2.0"
authors = ["Miso Labs, Inc. (build@miso.network)"]

# A per-track parallel array. Construction reads `Release` to size/validate the
# array against the tracklist, so alignment is an invariant of the type rather
# than a rule each extension must remember — hence the dependency on miso core.
[dependencies]
miso = { git = "https://github.com/misofm/protocol.git", rev = "ffa0e38b8ba4815d81de1076101ea37d2c71c623" }
