[package]
name = "release_track_data"
edition = "2024"
license = "FSL-1.1-ALv2"
authors = ["Miso Labs, Inc. (build@miso.fm)"]

# One value per track of a release. Construction reads `Release` to size/validate the
# array against the tracklist, so alignment is an invariant of the type rather
# than a rule each extension must remember — hence the dependency on musicos core.
[dependencies]
musicos = { git = "https://github.com/misofm/musicos.git", rev = "f613a89fadf57e180bc3ba910adbccf764bc08bc" }
